name: Build unsigned iOS IPA

on:
  workflow_dispatch:          # 支持手动触发
  push:
    branches: [main, dev]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14         # 自带 Xcode 15.x，支持 iOS 17.0 SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # 本仓库由 XcodeGen 管理，需先用 project.yml 重新生成 .xcodeproj
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme tvbox

      # 无签名归档：跳过证书与描述文件，公开仓库即可构建
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/tvbox.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # 手动打 IPA：.app 放入 Payload/ 目录后压缩
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/tvbox.xcarchive/Products/Applications/TVBox.app" build/Payload/
          cd build
          zip -qry TVBox-unsigned.ipa Payload
          ls -lh TVBox-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-unsigned-ipa
          path: build/TVBox-unsigned.ipa

      # 仅打 tag 时发布到 Release，普通 push 不发版
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TVBox-unsigned.ipa
